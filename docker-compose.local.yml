services:
  db:
    image: postgres:14-alpine
    container_name: ${PROJECT}_db
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE}
    restart: always
    networks:
      - local
  common:
    image: ${PROJECT}_base
    container_name: ${PROJECT}_common
    build:
      context: ./
      dockerfile: Dockerfile.local
      args:
        CA_CERTIFICATE_PATH: './cert/zscaler-root-ca.pem'
    command: 'yarn watch:common'
    volumes:
      - ./packages:/app/packages
  api:
    image: ${PROJECT}_base
    container_name: ${PROJECT}_api
    build:
      context: ./
      dockerfile: Dockerfile.local
      args:
        CA_CERTIFICATE_PATH: './cert/zscaler-root-ca.pem'
    command: 'yarn watch:api'
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
    ports:
      - '4000:4000'
    env_file: ./.env
    environment:
      # Both hosts are the compose service names: inside this network "localhost"
      # would resolve to the api container itself, not to db / keycloak.
      - POSTGRES_HOST=db
      - AUTH_URL=http://keycloak:8080
      - BUILD_ID=${COMMIT_SHA}
      - BUILD_INFO=${LAST_COMMIT_MESSAGE}
    depends_on:
      - db
      - common
    networks:
      - local

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: ${PROJECT}_keycloak
    command: start-dev --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    volumes:
      # Generated by `make generate-local-realm` from realm-ien.json, with all
      # passwords set to KEYCLOAK_LOCAL_PASSWORD provided by local developer. 
      # Gitignored; never committed. See ''.env-example' file.
      - ./keycloak/realm-ien.generated.json:/opt/keycloak/data/import/realm-ien.json
    ports:
      - '8080:8080'
    networks:
      - local

  web:
    image: ${PROJECT}_base
    container_name: ${PROJECT}_web
    build:
      context: ./
      dockerfile: Dockerfile.local
      args:
        CA_CERTIFICATE_PATH: './cert/zscaler-root-ca.pem'
    command: 'yarn watch:web'
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      # Keep Next's build output inside the container. The bind mount above would
      # otherwise write it to the host as root, and a later `make watch` (running
      # as your user) cannot delete those files to rebuild them.
      - web_next:/app/apps/web/.next
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
      - RUNTIME_ENV=local
      - NEXT_PUBLIC_AUTH_REALM=${NEXT_PUBLIC_AUTH_REALM}
      - NEXT_PUBLIC_AUTH_URL=${NEXT_PUBLIC_AUTH_URL}
    depends_on:
      - api

volumes:
  web_next:

networks:
  local:
    driver: bridge
